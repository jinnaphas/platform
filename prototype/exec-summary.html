<style>
  :root{
    --bg:#F2F5F7; --panel:#FFFFFF; --ink:#17232F; --muted:#5B6B7A; --line:#DCE4EA;
    --cx:#2358C6; --eco:#D96C2C; --iot:#7C4DC4; --is:#4E9F3D; --da:#10243E;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:'Sarabun',-apple-system,'Segoe UI',sans-serif;font-size:15px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:16px 22px 6px}
  header h1{margin:0;font-size:21px;font-weight:800}
  header .sub{color:var(--muted);font-size:14px}
  header a.back{margin-left:auto;color:var(--muted);font-size:13.5px;text-decoration:none;
       border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--panel)}
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 22px 12px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;
       padding:7px 15px;font:600 14.5px 'Sarabun',sans-serif;cursor:pointer}
  .tab.on{color:#fff;border-color:transparent}
  .spacer{flex:1}
  .btn{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;
       padding:6px 12px;font:600 13.5px 'Sarabun',sans-serif;cursor:pointer}
  .btn:hover,.tab:hover{border-color:#B7C4CE}
  .hint{color:var(--muted);font-size:12.5px;padding:0 22px 6px}
  #frame{margin:0 22px 22px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
       overflow:hidden;position:relative}
  #frame:fullscreen{background:var(--panel)}
  svg{display:block;width:100%;height:auto;cursor:grab;user-select:none}
  svg.panning{cursor:grabbing}
  svg text{font-family:'Sarabun',-apple-system,sans-serif}
  .ring{cursor:pointer;transition:opacity .25s}
  .shcard{transition:opacity .25s}
  .dim{opacity:.14}
</style>

/* ===== SVG helpers ===== */
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("cv");
function el(parent, tag, attrs){ const n=document.createElementNS(NS,tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; }
function txt(parent, x, y, s, size, fill, weight, anchor){
  const t=el(parent,"text",{x,y,"font-size":size,fill,"font-weight":weight||500,
    "text-anchor":anchor||"middle"}); t.textContent=s; return t; }
function tint(hex, a){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`; }
function wrap(s, max){ if(s.length<=max) return [s];
  const i=s.lastIndexOf(" ",max); if(i<8) return [s];
  return [s.slice(0,i), ...wrap(s.slice(i+1),max)]; }

/* ===== วาดทั้งภาพของ 1 ทีม ===== */
let curTeam = "tcs", focusRing = null;
function render(){
  svg.innerHTML=""; focusRing=null;
  const T = DATA[curTeam];
  const root = el(svg,"g",{});
  el(root,"rect",{x:0,y:0,width:1900,height:1240,fill:"#FFFFFF"});

  txt(root, 40, 46, `${T.name} — มุมมองอย่างย่อ (Gartner DBTP)`, 24, T.color, 800, "start");
  txt(root, 1860, 46, "หัวข้อระดับ Platform เท่านั้น · ไม่ลง Activity", 14.5, "#5B6B7A", 500, "end");

  /* ----- มือถือ ----- */
  const P = {x:590, y:70, w:720, h:1110, rx:46};
  el(root,"rect",{x:P.x,y:P.y,width:P.w,height:P.h,rx:P.rx,fill:"#10243E"});
  txt(root, 950, P.y+46, T.phone, 23, "#FFFFFF", 700);
  txt(root, 950, P.y+74, "1 มือถือ = 1 Platform · ข้างในคือ 5 ห่วง DBTP", 14, "#9FB2C8", 500);
  const S = {x:P.x+22, y:P.y+92, w:P.w-44, h:P.h-116};
  el(root,"rect",{x:S.x,y:S.y,width:S.w,height:S.h,rx:26,fill:"#F7FAFC",stroke:"#2C3F58","stroke-width":1});
  el(root,"rect",{x:950-56,y:P.y+16,width:112,height:10,rx:5,fill:"#2C3F58"});

  /* ----- 5 ห่วง: 4 มุม + ตรงกลาง ----- */
  const R=168, RC=150;
  const pos = { cx:[782,418], eco:[1118,418], iot:[782,938], is:[1118,938], da:[950,678] };
  const gRings = el(root,"g",{});
  for(const key of ["cx","eco","iot","is","da"]){
    const def=RING_DEF[key], [cx0,cy0]=pos[key], center=(key==="da");
    const g = el(gRings,"g",{class:"ring","data-ring":key});
    el(g,"circle",{cx:cx0,cy:cy0,r:center?RC:R,
      fill:center?def.color:tint(def.color,.07),
      stroke:def.color,"stroke-width":center?0:3.5});
    const topics = T.rings[key];
    let lines=[]; topics.forEach(tp=>{ lines.push(...wrap(tp,24)); });
    if(!topics.length) lines=["— ยังไม่มี —"];
    const inkC = center? "#FFFFFF" : "#21313F";
    const lh=27, blockH = 58 + lines.length*lh;
    let y = cy0 - blockH/2 + 24;
    txt(g, cx0, y, def.th, center?21:21.5, center?"#FFFFFF":def.color, 800); y+=20;
    txt(g, cx0, y+2, def.en, 13, center?"#9FB2C8":tint(def.color,.8), 600);
    y+=14; el(g,"line",{x1:cx0-52,y1:y,x2:cx0+52,y2:y,stroke:center?"#3D5470":tint(def.color,.4),"stroke-width":1.5});
    y+=24;
    for(const ln of lines){
      const t = txt(g, cx0, y, ln, 17.5, topics.length?inkC:"#8A97A3", topics.length?600:500);
      if(!topics.length) t.setAttribute("font-style","italic");
      y+=lh;
    }
    g.addEventListener("click", ()=>toggleFocus(key));
  }

  /* ----- Stakeholder รอบข้าง ----- */
  const colX = {L:30, R:1370}, W=500;
  const ys = {L:86, R:86};
  for(const s of T.sh){
    const h = 58 + s.ents.length*30 + 14;
    const x = colX[s.side], y = ys[s.side]; ys[s.side] += h + 26;
    const hue = HUE[s.hue]||"#5B6B7A";
    const g = el(root,"g",{class:"shcard"});
    /* เส้นเชื่อมเข้ามือถือ */
    const x1 = s.side==="L" ? x+W : x, x2 = s.side==="L" ? P.x : P.x+P.w, my=y+h/2;
    el(g,"path",{d:`M${x1} ${my} C ${x1+(x2-x1)*.45} ${my}, ${x2+(x1-x2)*.45} ${my}, ${x2} ${my}`,
      fill:"none",stroke:"#C4CFD8","stroke-width":1.8});
    el(g,"circle",{cx:x2,cy:my,r:5,fill:hue});
    el(g,"rect",{x,y,width:W,height:h,rx:14,fill:"#FFFFFF",stroke:"#DCE4EA","stroke-width":1.5});
    el(g,"rect",{x,y,width:7,height:h,rx:3.5,fill:hue});
    txt(g, x+26, y+37, s.title, 20, "#17232F", 800, "start");
    let yy=y+70;
    for(const e of s.ents){ el(g,"circle",{cx:x+34,cy:yy-6,r:3.4,fill:hue});
      txt(g, x+50, yy, e, 17, "#42525F", 500, "start"); yy+=30; }
  }

  txt(root, 950, 1222, "Version ย่อเพื่อการนำเสนอ — รายละเอียด Capability / Activity ดูได้ใน RST Architecture Studio", 14, "#8A97A3", 500);
}

function toggleFocus(key){
  focusRing = (focusRing===key)? null : key;
  document.querySelectorAll(".ring").forEach(r=>{
    r.classList.toggle("dim", focusRing!==null && r.getAttribute("data-ring")!==focusRing);
  });
}

/* ===== แท็บทีม ===== */
const tabsBox = document.getElementById("tabs");
for(const k of ORDER){
  const b=document.createElement("button"); b.className="tab"; b.textContent=DATA[k].name;
  b.addEventListener("click",()=>{ curTeam=k; syncTabs(); render(); fit(); });
  b.dataset.k=k; tabsBox.appendChild(b);
}
function syncTabs(){ tabsBox.querySelectorAll(".tab").forEach(b=>{
  const on=b.dataset.k===curTeam; b.classList.toggle("on",on);
  b.style.background = on? DATA[b.dataset.k].color : ""; }); }

/* ===== ซูม / แพน / เต็มจอ ===== */
const VB0={x:0,y:0,w:1900,h:1240}; let VB={...VB0};
function applyVB(){ svg.setAttribute("viewBox",`${VB.x} ${VB.y} ${VB.w} ${VB.h}`); }
function fit(){ VB={...VB0}; applyVB(); }
function zoomAt(f,px,py){
  const nw=Math.min(VB0.w*1.15, Math.max(VB0.w*.18, VB.w*f)); const k=nw/VB.w;
  VB.x = px-(px-VB.x)*k; VB.y = py-(py-VB.y)*k; VB.w=nw; VB.h=VB0.h*(nw/VB0.w); applyVB(); }
function ptr(e){ const r=svg.getBoundingClientRect();
  return [VB.x+(e.clientX-r.left)/r.width*VB.w, VB.y+(e.clientY-r.top)/r.height*VB.h]; }
svg.addEventListener("wheel",e=>{ e.preventDefault(); const [px,py]=ptr(e);
  zoomAt(e.deltaY>0?1.12:0.89,px,py); },{passive:false});
let drag=null;
svg.addEventListener("pointerdown",e=>{ drag={x:e.clientX,y:e.clientY,vx:VB.x,vy:VB.y};
  svg.classList.add("panning"); svg.setPointerCapture(e.pointerId); });
svg.addEventListener("pointermove",e=>{ if(!drag) return; const r=svg.getBoundingClientRect();
  VB.x=drag.vx-(e.clientX-drag.x)/r.width*VB.w; VB.y=drag.vy-(e.clientY-drag.y)/r.height*VB.h; applyVB(); });
svg.addEventListener("pointerup",()=>{ drag=null; svg.classList.remove("panning"); });
document.getElementById("zIn").onclick =()=>zoomAt(0.8, VB.x+VB.w/2, VB.y+VB.h/2);
document.getElementById("zOut").onclick=()=>zoomAt(1.25,VB.x+VB.w/2, VB.y+VB.h/2);
document.getElementById("zFit").onclick=fit;
document.getElementById("zFull").onclick=()=>{ const f=document.getElementById("frame");
  document.fullscreenElement? document.exitFullscreen() : f.requestFullscreen(); };

syncTabs(); render(); fit();
</script>
</body>
</html>
